services:
  # ---------------------------------------------------------------- WhatsApp
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # Deliver every message event to the bot. `message.any` is required so
      # that messages you send to yourself (fromMe) reach the bot as well.
      WHATSAPP_HOOK_URL: http://bot:8000/webhook
      WHATSAPP_HOOK_EVENTS: message,message.any
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_HMAC_KEY:-}
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      # WAHA silently replaces well-known values ("waha", "admin", "123", ...)
      # with a random password, so leave this empty to let WAHA generate and
      # print one, or set a strong value in .env.
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-}
    volumes:
      - ./waha_sessions:/app/.sessions
    extra_hosts:
      # Lets you run the bot on the host while WAHA stays in Docker.
      - "host.docker.internal:host-gateway"
    depends_on:
      - bot

  # -------------------------------------------------------------------- Bot
  bot:
    build: .
    container_name: rag-whatsapp-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network WAHA is reachable by service name.
      WAHA_BASE_URL: http://waha:3000
    volumes:
      - ./documents:/app/documents
      - ./chroma_db:/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

services:
  # ================================================================ QDRANT (Vector DB)
  qdrant:
    # Pinned to the version currently in use; `latest` can break the client API.
    image: qdrant/qdrant@sha256:d277592721d2e3b73f9b797b53cf05e6a5bb2134f6d13fdbda4ca51782afbcac
    container_name: qdrant
    restart: unless-stopped
    init: true
    ports:
      # Loopback only: the vector DB has no other protection. The container
      # binds to 0.0.0.0 inside Docker; host port is published on 127.0.0.1.
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # ================================================================ PERSONAL
  waha-personal:
    image: devlikeapro/waha@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779
    container_name: waha-personal
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_HOOK_URL: http://bot-personal:8000/webhook
      WHATSAPP_HOOK_EVENTS: message,message.any
      WAHA_API_KEY: ${WAHA_API_KEY_PERSONAL:-}
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_HMAC_KEY_PERSONAL:-}
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_PRINT_QR: "false"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME_PERSONAL:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD_PERSONAL:-}
      # Voice notes must be downloaded to disk so the bot can fetch them.
      WHATSAPP_DOWNLOAD_MEDIA: "true"
      WHATSAPP_FILES_FOLDER: /app/.media
      WHATSAPP_FILES_LIFETIME: "600"
    volumes:
      - ./waha_sessions/personal:/app/.sessions
      - ./waha_media/personal:/app/.media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      bot-personal:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  bot-personal:
    build: .
    container_name: rag-whatsapp-bot-personal
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env.personal
    environment:
      WAHA_BASE_URL: http://waha-personal:3000
      WAHA_SESSION: personal
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: rag_documents_personal
      FASTEMBED_CACHE_PATH: /model-cache
      CACHE_DIR: /app/cache/personal
      STRUCTURED_DB_PATH: /app/cache/personal/structured_data.sqlite
      ENABLE_TABLE_EXTRACTION: "true"
    volumes:
      - ./documents_personal:/app/documents
      - ./cache/personal:/app/cache/personal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    depends_on:
      qdrant:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # ================================================================ WORK (optional profile)
  waha-work:
    image: devlikeapro/waha@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779
    container_name: waha-work
    restart: unless-stopped
    init: true
    profiles: ["work"]
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_HOOK_URL: http://bot-work:8000/webhook
      WHATSAPP_HOOK_EVENTS: message,message.any
      WAHA_API_KEY: ${WAHA_API_KEY_WORK:-}
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_HMAC_KEY_WORK:-}
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_PRINT_QR: "false"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME_WORK:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD_WORK:-}
      # Voice notes must be downloaded to disk so the bot can fetch them.
      WHATSAPP_DOWNLOAD_MEDIA: "true"
      WHATSAPP_FILES_FOLDER: /app/.media
      WHATSAPP_FILES_LIFETIME: "600"
    volumes:
      - ./waha_sessions/work:/app/.sessions
      - ./waha_media/work:/app/.media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      bot-work:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  bot-work:
    build: .
    container_name: rag-whatsapp-bot-work
    restart: unless-stopped
    init: true
    profiles: ["work"]
    ports:
      - "127.0.0.1:8002:8000"
    env_file:
      - .env.work
    environment:
      WAHA_BASE_URL: http://waha-work:3000
      WAHA_SESSION: work
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: rag_documents_work
      FASTEMBED_CACHE_PATH: /model-cache
      CACHE_DIR: /app/cache/work
      STRUCTURED_DB_PATH: /app/cache/work/structured_data.sqlite
      ENABLE_TABLE_EXTRACTION: "true"
    volumes:
      - ./documents_work:/app/documents
      - ./cache/work:/app/cache/work
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    depends_on:
      qdrant:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G


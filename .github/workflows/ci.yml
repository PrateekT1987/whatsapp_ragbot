name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DOCKER_BUILDKIT: "1"

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linters
        run: pip install ruff==0.4.0 mypy==1.10.0
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy --ignore-missing-imports main.py rag.py waha.py vectorstore.py cache.py config.py embeddings.py watcher.py run.py voice.py structured_extractor.py

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: pytest test_p1.py test_p2.py -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build personal bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: whatsapp_bot-bot-personal:test
          target: final
      - name: Build work bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: whatsapp_bot-bot-work:test
          target: final
      - name: Smoke test personal image
        run: |
          docker run --rm \
            -e OPENROUTER_API_KEY=test \
            -e CACHE_DIR=/tmp/c \
            -e QDRANT_URL=http://127.0.0.1:1 \
            -e WAHA_BASE_URL=http://127.0.0.1:1 \
            -e WAHA_SESSION=test \
            --entrypoint python \
            whatsapp_bot-bot-personal:test \
            -c "import main, rag, waha, vectorstore, cache, formatting, config; print('imports ok')"

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # Informational: a published CVE or a flaky PyPI mirror must not block the
    # build. Findings are still printed in the job log.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project dependencies
        run: pip install --no-cache-dir -r requirements.txt
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit installed packages
        run: pip-audit --local --progress-spinner off

  # Optional: publish images on tag
  # publish:
